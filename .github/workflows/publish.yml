name: publish

on:
  release:
    types: [published]

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm install
      - name: 发布到 npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-scope-manager@$VERSION" version >/dev/null 2>&1; then
            echo "dsh-scope-manager@$VERSION 已经在 registry 上，跳过发布。"
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
